name: Generate PDF on Update

on:
  push:
    branches:
      - main

# מניעת הרצת כמה workflows במקביל שיוצרים קונפליקט ב-push
concurrency:
  group: generate-pdf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  convert_to_pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Hebrew fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto libnss3 libatk-bridge2.0-0 libxss1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install puppeteer

      - name: Generate PDF
        run: node generate-pdf.js

      - name: Commit and Push PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generated updated PDF [skip ci]"
          file_pattern: 'catalog.pdf'
