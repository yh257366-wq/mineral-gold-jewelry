name: Generate PDF on Update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  convert_to_pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Hebrew fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-culmus libnss3 libatk-bridge2.0-0 libxss1 libasound2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install puppeteer serve wait-on

      - name: Start local server
        run: npx serve -l 8080 . &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:8080 -t 30000

      - name: Generate PDF
        run: node generate-pdf.js

      - name: Commit and Push PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.pdf
          git commit -m "Auto-generated updated PDF [skip ci]" || exit 0
          git push
