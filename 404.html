<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תכשיטי מינרל גולד</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf6ee;font-family:Arial,Helvetica,sans-serif;color:#1c1917;text-align:center}
.box{max-width:420px;padding:24px}
h1{font-size:24px;margin:0 0 12px}
p{line-height:1.7;margin:0 0 18px}
a.btn{display:inline-block;background:#b8935a;color:#000;font-weight:700;text-decoration:none;padding:12px 32px;border-radius:8px}
</style>
</head>
<body>
<div class="box" id="box"></div>
<script>
(function () {
  var CATALOG = "https://github.com/yh257366-wq/mineral-gold-jewelry/releases/download/catalog-latest/catalog.pdf";
  var path = location.pathname.toLowerCase().replace(/\/+$/, "");
  var box = document.getElementById("box");
  if (path === "/catalog.pdf") {
    box.innerHTML = '<h1>הורדת הקטלוג מתבצעת...</h1>' +
      '<p>אם ההורדה לא התחילה, אפשר ללחוץ על הכפתור.</p>' +
      '<a class="btn" href="' + CATALOG + '">להורדת הקטלוג (PDF)</a>';
    location.replace(CATALOG);
  } else {
    box.innerHTML = '<h1>העמוד לא נמצא</h1>' +
      '<p>ייתכן שהקישור ישן או שגוי.</p>' +
      '<a class="btn" href="/">לאתר תכשיטי מינרל גולד</a>';
  }
})();
</script>
</body>
</html>
