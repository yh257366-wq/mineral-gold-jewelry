<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>קטלוג תכשיטים - תכשיטי מינרל גולד</title>
  <style>
    @page {
      size: A4;
      margin: 12mm;
    }
    body {
      font-family: 'Noto Sans Hebrew', system-ui, sans-serif;
      color: #1c1917;
      margin: 0;
      padding: 0;
      background: #fff;
    }
    .catalog-header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #d4af37;
      padding-bottom: 10px;
    }
    .catalog-header h1 {
      margin: 0;
      color: #1c1917;
      font-size: 24px;
    }
    .catalog-header p {
      margin: 5px 0 0;
      color: #666;
      font-size: 14px;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
    .product-card {
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 12px;
      box-sizing: border-box;
      page-break-inside: avoid;
      break-inside: avoid;
      text-align: center;
    }
    .product-card img {
      max-width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .product-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 4px;
    }
    .product-price {
      color: #d4af37;
      font-weight: bold;
      font-size: 15px;
    }
    .product-desc {
      font-size: 12px;
      color: #555;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="catalog-header">
    <h1>תכשיטי מינרל גולד - קטלוג מלא</h1>
    <p>קולקציית תכשיטים ייחודיים בעבודת יד</p>
  </div>

  <div id="catalog-container" class="products-grid">
    <!-- המוצרים ייטענו לכאן אוטומטית מתוך index.html -->
  </div>

  <script>
    async function syncFromIndex() {
      try {
        // טעינת התוכן המלא של index.html
        const res = await fetch('index.html');
        const htmlText = await res.text();
        
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        
        const container = document.getElementById('catalog-container');
        
        // שליפת המוצרים מתוך האלמנטים המוגדרים ב-index.html
        const items = doc.querySelectorAll('.product-card, [data-product-id], .gallery-item');
        
        if (items.length > 0) {
          items.forEach(item => {
            const clone = item.cloneNode(true);
            container.appendChild(clone);
          });
        } else {
          // במידה ו-index.html טוען את המוצרים דרך מערך JavaScript
          const scripts = doc.querySelectorAll('script');
          scripts.forEach(script => {
            if (script.textContent.includes('products') || script.src.includes('products')) {
              eval(script.textContent);
            }
          });
          
          if (typeof products !== 'undefined' && Array.isArray(products)) {
            products.forEach(p => {
              const card = document.createElement('div');
              card.className = 'product-card';
              card.innerHTML = `
                <img src="${p.image || p.img}" alt="${p.title || p.name}">
                <div class="product-title">${p.title || p.name}</div>
                <div class="product-price">${p.price} ₪</div>
                ${p.description ? `<div class="product-desc">${p.description}</div>` : ''}
              `;
              container.appendChild(card);
            });
          }
        }
      } catch (err) {
        console.error('שגיאה בסינכרון הנתונים מ-index.html:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', syncFromIndex);
  </script>
</body>
</html>
