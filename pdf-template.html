<style>

@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#16120f;--ivory:#faf6ee;--gold:#b08a2e;--gold2:#d9bb62;--wine:#8a2b2b;--mute:#6f675d}
html,body{background:#e9e4da;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:'Heebo',sans-serif;color:var(--ink);direction:rtl}
.page{width:210mm;height:297mm;margin:8mm auto;background:var(--ivory);position:relative;overflow:hidden;page-break-after:always;break-after:page;box-shadow:0 4px 24px rgba(0,0,0,.15)}
.page:last-child{page-break-after:auto;break-after:auto}
@media print{html,body{background:none}.page{margin:0;box-shadow:none}}
.gold-text{background:linear-gradient(135deg,#8f6d1c,#e3c870 45%,#9c7620);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* cover */
.cover{background:radial-gradient(ellipse at 50% 38%,#2a221b 0%,#120e0b 70%);color:#f3ead7;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22mm}
.cover .frame{position:absolute;inset:10mm;border:1px solid rgba(217,187,98,.55)}
.cover .frame::after{content:'';position:absolute;inset:3mm;border:1px solid rgba(217,187,98,.22)}
.cover img{width:62mm;margin-bottom:14mm;border-radius:4px}
.cover .eyebrow{letter-spacing:.5em;font-size:11px;color:var(--gold2);margin-bottom:6mm;font-weight:300}
.cover h1{font-family:'Frank Ruhl Libre',serif;font-weight:500;font-size:46px;line-height:1.2;margin-bottom:6mm}
.cover .sub{font-family:'Frank Ruhl Libre',serif;font-weight:300;font-size:17px;color:#d8cdb6;margin-bottom:14mm}
.cover .rule{width:70mm;margin:0 auto 12mm}
.cover .badge{display:inline-block;border:1px solid var(--gold2);color:var(--gold2);padding:3mm 9mm;font-size:14px;letter-spacing:.06em}
        .cover .badge-date{margin-top:5mm;font-size:12px;font-weight:300;letter-spacing:.12em;color:#d8cdb6}

/* product pages */
.head{position:absolute;top:11mm;right:16mm;left:16mm;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.3em;color:var(--mute)}
.head b{font-family:'Frank Ruhl Libre',serif;letter-spacing:.12em;font-size:13px;font-weight:700}
.foot{position:absolute;bottom:9mm;right:16mm;left:16mm;display:flex;justify-content:space-between;font-size:10px;color:var(--mute);letter-spacing:.12em}
.list{position:absolute;top:21mm;bottom:17mm;right:16mm;left:16mm;display:grid;grid-template-rows:repeat(3,1fr);gap:0}
.item{display:flex;gap:9mm;align-items:center;border-top:1px solid rgba(176,138,46,.4);padding:4.5mm 0}
.item:first-child{border-top:none}
.item.alt{flex-direction:row-reverse}
.pic{flex:0 0 62mm;height:62mm;position:relative}
.pic::before{content:'';position:absolute;inset:2.5mm -2.5mm -2.5mm 2.5mm;border:1px solid var(--gold);z-index:0}
.item.alt .pic::before{inset:2.5mm 2.5mm -2.5mm -2.5mm}
.pic img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;background:#f0eadd}
.pic img.contain{object-fit:contain}
.info{flex:1;min-width:0}
.meta{font-size:10px;letter-spacing:.22em;color:var(--gold);font-weight:500;margin-bottom:1.5mm}
.title{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:21px;line-height:1.2;margin-bottom:2mm}
.price{display:flex;align-items:baseline;gap:3mm;margin-bottom:2.5mm}
.price .now{font-family:'Frank Ruhl Libre',serif;font-size:21px;font-weight:700;color:var(--wine)}
.price .old{font-size:12px;color:#a59c8e;text-decoration:line-through}
.desc{font-size:11px;line-height:1.55;color:#2c2620;font-weight:300;margin-bottom:2.5mm}
.specs{font-size:10px;line-height:1.55;color:#3a342c;border-right:2px solid var(--gold);padding-right:3mm;margin-bottom:2.5mm}
.specs b{font-weight:700;color:#7a5a12}
.specs .care b{color:var(--wine)}
.chain{font-size:10px;color:#3f6b4a;font-weight:500;margin-bottom:2.5mm}
.ups{display:flex;gap:2mm;flex-wrap:wrap;align-items:center;font-size:9.5px}
.ups .lbl{color:var(--mute);letter-spacing:.08em;margin-left:1mm}
.chip{border:1px solid rgba(176,138,46,.6);padding:.8mm 2.6mm;color:#3a342c;background:rgba(255,255,255,.5)}
.chip s{color:#a59c8e}
.chip .old-label{color:#a59c8e;text-decoration:none}

/* contact */
.contact{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#2a221b 0%,#120e0b 72%);color:#f3ead7}

.contact img{width:42mm;margin-bottom:10mm;border-radius:3px}
.contact h2{font-family:'Frank Ruhl Libre',serif;font-weight:500;font-size:34px;margin-bottom:4mm}
.contact p{font-weight:300;font-size:14px;color:#d8cdb6;margin-bottom:10mm}
.contact .rule{width:60mm;margin:0 auto 10mm}
.contact a{display:block;color:var(--gold2);text-decoration:none;font-size:15px;letter-spacing:.06em;margin:2.5mm 0;direction:ltr}

function getUpgrades(p){
  if(p.sku==="003") return [
    {t:"כסף 925: כלול במחיר"},
    {t:"חוט נחושת זהוב: 64 ₪",old:"80"},
    {t:"שדרוג לגולדפילד: \u200E+16 ₪",old:"\u200E+20"}];
  let o925=70,oGold=90;
  if(p.sku==="020"){o925=145;oGold=180}
  else if(["018","019","023","026","027","028","029","033"].includes(p.sku)){o925=80;oGold=100}
  else if(p.type==="סט תכשיטים"){o925=130;oGold=170}
  else if(["001","002","021"].includes(p.sku)){o925=130;oGold=150}
  return [
    {t:"כסף 925: \u200E+"+Math.round(o925*0.8)+" ₪",old:"\u200E+"+o925},
    {t:"גולדפילד: \u200E+"+Math.round(oGold*0.8)+" ₪",old:"\u200E+"+oGold}];
}

function itemHtml(p,i){
  const isPendant=(p.type==="תליון"||p.type==="סט תכשיטים");
  const contain=(p.sku==="030"||p.id===30||p.sku==="001");
  const care=(p.sku==="031"||p.id===31)
    ? '<div class="care"><b>טיפול נכון במוצר:</b> לשמירה על גוון האבנים, מומלץ להימנע ממגע עם מים, בשמים, אלכוהול וחומרי ניקוי.</div>'
    : '<div><b>גימור:</b> ציפוי שקוף איכותי לשימור הברק.</div>';
  const size=p.size||(p.stoneSize?p.stoneSize+" | "+p.totalLength:"");
  const ups=getUpgrades(p).map(u=>'<span class="chip">'+u.t+(u.old?' (<span class="old-label">במקום</span> <s>'+u.old+' ₪</s>)':'')+'</span>').join("");
  return `<div class="item ${i%2?'alt':''}">
    <div class="pic"><img class="${contain?'contain':''}" src="${p.img}" alt="${p.title}"></div>
    <div class="info">
      <div class="meta">מק"ט ${p.sku} · ${p.type}</div>
      <div class="title">${p.title}</div>
      <div class="price"><span class="now">${p.price} ₪</span><span class="old">${p.originalPrice} ₪</span></div>
      <div class="desc">${p.desc}</div>
      <div class="specs"><div><b>חומרים:</b> ${p.material}</div><div><b>גודל:</b> ${size}</div>${care}</div>
      ${isPendant?'<div class="chain">✦ אורך שרשרת לבחירה: 45-60 ס"מ</div>':''}
      <div class="ups"><span class="lbl">שדרוג מתכת</span>${ups}</div>
    </div></div>`;
}

  const per=3, pages=Math.ceil(products.length/per), total=pages+2;

    <div class="badge-date">המבצע בתוקף עד 01/12/2026</div></section>`;
  for(let pg=0;pg<pages;pg++){
    const chunk=products.slice(pg*per,pg*per+per);
    h+=`<section class="page"><div class="head"><b>מינרל גולד</b><span>MINERAL GOLD</span></div>
      <div class="list">${chunk.map((p,i)=>itemHtml(p,pg*per+i)).join("")}</div>
      <div class="foot"><span>mineral-gold.co.il</span><span>${pg+2} / ${total}</span></div></section>`;
  }
  h+=`<section class="page contact"><div class="frame"></div>
    <img src="${LOGO}" alt="מינרל גולד">
    <h2 class="gold-text">מעוניינים להזמין?</h2>
    <p>נשמח לעמוד לשירותכם בכל שאלה או בקשה מיוחדת</p>
    <div class="rule"></div>
    <a href="mailto:yh257366@gmail.com">yh257366@gmail.com</a>
    <a href="https://mineral-gold.co.il/">mineral-gold.co.il</a></section>`;
  root.innerHTML=h;
}
