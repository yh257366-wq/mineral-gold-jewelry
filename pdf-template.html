    function getUpgradeHtml(p) {
      if (p.sku === "003") {
        return `
          <div class="upgrades-title">אפשרויות לשדרוג המתכת:</div>
          <div>• שדרוג לכסף 925: כלול במחיר</div>
          <div>• חוט נחושת זהוב: 64 ₪ <span style="text-decoration:line-through; color:#888;">(במקום 80 ₪)</span></div>
          <div>• גולדפילד: <span class="price-tag">+16 ₪</span> <span style="text-decoration:line-through; color:#888;">(<span class="price-tag">+20 ₪</span>)</span></div>
        `;
      }

      let original925 = 70, originalGold = 90;
      if (p.sku === "020") {
        original925 = 145; originalGold = 180;
      } else if (["018", "019", "023", "026", "027"].includes(p.sku)) {
        original925 = 80; originalGold = 100;
      } else if (p.type === "סט תכשיטים") {
        original925 = 130; originalGold = 170;
      } else if (["001", "002", "021"].includes(p.sku)) {
        original925 = 130; originalGold = 150;
      }

      const sale925 = Math.round(original925 * 0.8);
      const saleGold = Math.round(originalGold * 0.8);

      return `
        <div class="upgrades-title">אפשרויות לשדרוג המתכת:</div>
        <div>• שדרוג לכסף 925: <span class="price-tag">+${sale925} ₪</span> <span style="text-decoration:line-through; color:#888;">(<span class="price-tag">+${original925} ₪</span>)</span></div>
        <div>• גולדפילד: <span class="price-tag">+${saleGold} ₪</span> <span style="text-decoration:line-through; color:#888;">(<span class="price-tag">+${originalGold} ₪</span>)</span></div>
      `;
    }

    function renderCatalog() {
      const container = document.getElementById('catalog-container');
      if (!container) return;
      container.innerHTML = '';
      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        
        const lengthInfo = (p.type === "תליון" || p.type === "סט תכשיטים") 
          ? `<div class="chain-length-info">✦ אורך שרשרת לבחירה: 45-60 ס"מ</div>` 
          : '';

        card.innerHTML = `
          <div class="card-content">
            <img src="${p.img}" alt="${p.title}">
            <div class="details">
              <div>
                <div class="top-meta">
                  <span class="product-sku">מק"ט: ${p.sku}</span>
                  <span class="product-type-badge">${p.type}</span>
                </div>
                <div class="product-title">${p.title}</div>
                <div class="price-row">
                  <span class="original-price">${p.originalPrice} ₪</span>
                  <span class="sale-price">מחיר מבצע: ${p.price} ₪</span>
                </div>
                <div class="product-description">${p.desc}</div>
                <div class="product-specs">
                  <strong>חומרים:</strong> ${p.material}<br>
                  <strong>גודל:</strong> ${p.size}<br>
                  <strong>גימור:</strong> מצופה בציפוי שקוף (היפואלרגני) לשימור הברק.
                </div>
                ${lengthInfo}
              </div>
              <div class="upgrades-box">
                ${getUpgradeHtml(p)}
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    renderCatalog();
  </script>
