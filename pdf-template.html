      margin: 0;
      padding: 0;
      background: #fff;
    }
    .catalog-header {
      text-align: center;
      margin-bottom: 15px;

      padding-bottom: 8px;
    }
    .catalog-header h1 {
      margin: 0;
      color: #1c1917;
      font-size: 22px;
    }
    .catalog-header p {
      margin: 3px 0 0;
      color: #666;
      font-size: 13px;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .product-card {
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box;
      page-break-inside: avoid;
      break-inside: avoid;
      background: #fafafa;
    }
    .card-content {
      display: flex;
      gap: 10px;
    }
    .product-card img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .details {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .product-sku {
      font-size: 10px;
      color: #78716c;
    }
    .product-title {
      font-weight: bold;
      font-size: 14px;
      margin: 2px 0 4px 0;
      color: #1c1917;
    }
    .price-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .original-price {
      text-decoration: line-through;
      color: #dc2626;
      font-size: 12px;
    }
    .sale-price {
      color: #dc2626;
      font-weight: bold;
      font-size: 14px;
    }
    .upgrades-box {

      border-radius: 4px;
      padding: 5px;
      font-size: 10.5px;
      color: #444;
      line-height: 1.3;

    .upgrades-title {

      color: #78350f;
      margin-bottom: 2px;

    function getUpgradeHtml(p) {
      if (p.sku === "003") {
        return `
          <div class="upgrades-title">אפשרויות מתכת:</div>
          <div>• כסף 925: כלול במחיר</div>
          <div>• חוט נחושת זהוב: 64 ₪ (במקום 80 ₪)</div>
          <div>• גולדפילד: +16 ₪ (במקום +20 ₪)</div>
        `;
      }

      let original925 = 70, originalGold = 90;
      if (p.sku === "020") {
        original925 = 145; originalGold = 180;
      } else if (["018", "019", "023", "026", "027"].includes(p.sku)) {
        original925 = 80; originalGold = 100;
      } else if (p.type === "סט תכשיטים") {
        original925 = 130; originalGold = 170;
      } else if (["001", "002", "021"].includes(p.sku)) {
        original925 = 130; originalGold = 150;
      }

      const sale925 = Math.round(original925 * 0.8);
      const saleGold = Math.round(originalGold * 0.8);

      return `
        <div class="upgrades-title">אפשרויות שדרוג מתכת:</div>
        <div>• כסף 925: +${sale925} ₪ <span style="text-decoration:line-through; color:#888;">(+${original925} ₪)</span></div>
        <div>• גולדפילד: +${saleGold} ₪ <span style="text-decoration:line-through; color:#888;">(+${originalGold} ₪)</span></div>
      `;
    }

    function renderCatalog() {
      const container = document.getElementById('catalog-container');
      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        
        const lengthInfo = (p.type === "תליון" || p.type === "סט תכשיטים") 
          ? `<div style="font-size:10px; color:#555; margin-top:3px;">אורך שרשרת לבחירה: 45, 50, 55, 60 ס"מ</div>` 
          : '';

        card.innerHTML = `
          <div class="card-content">
            <img src="${p.img}" alt="${p.title}">
            <div class="details">
              <div>
                <div class="product-sku">מק"ט: ${p.sku} | ${p.type}</div>
                <div class="product-title">${p.title}</div>
                <div class="price-row">
                  <span class="original-price">${p.originalPrice} ₪</span>
                  <span class="sale-price">מבצע: ${p.price} ₪</span>
                </div>
                ${lengthInfo}
              </div>
              <div class="upgrades-box">
                ${getUpgradeHtml(p)}
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', renderCatalog);
