  <style>
    @page {
      size: A4;
      margin: 8mm;
    }
    body {
      font-family: 'Noto Sans Hebrew', system-ui, -apple-system, sans-serif;
      color: #1c1917;
      margin: 0;
      padding: 0;
      background: #fff;
      direction: rtl;
    }
    .catalog-header {
      text-align: center;
      margin-bottom: 12px;
      border-bottom: 2px solid #d4af37;
      padding-bottom: 6px;
    }
    .catalog-header h1 {
      margin: 0;

      font-size: 20px;
    }
    .catalog-header p {
      margin: 2px 0 0;
      color: #666;
      font-size: 12px;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .product-card {
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 8px;
      box-sizing: border-box;
      page-break-inside: avoid;
      break-inside: avoid;
      background: #fafafa;
    }
    .card-content {
      display: flex;
      gap: 10px;
    }
    .product-card img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .details {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .product-sku {
      font-size: 10px;
      color: #78716c;
    }
    .product-title {
      font-weight: bold;
      font-size: 13px;
      margin: 1px 0 3px 0;
      color: #1c1917;
    }
    .price-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .original-price {
      text-decoration: line-through;
      color: #dc2626;
      font-size: 11px;
    }
    .sale-price {
      color: #dc2626;
      font-weight: bold;
      font-size: 13px;
    }
    .product-description {
      font-size: 9.5px;
      color: #444;
      line-height: 1.25;
      margin-bottom: 4px;
    }
    .product-specs {
      font-size: 9px;
      color: #666;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .upgrades-box {
      background: #fff;
      border: 1px solid #e7e5e4;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 9.5px;
      color: #444;
      line-height: 1.3;
    }
    .upgrades-title {
      font-weight: bold;
      color: #78350f;
      margin-bottom: 1px;
    }
    .price-tag {
      direction: ltr;
      display: inline-block;
    }
  </style>

        `;
      }

      let original925 = 70, originalGold = 90;
      if (p.sku === "020") {
        original925 = 145; originalGold = 180;
      } else if (["018", "019", "023", "026", "027"].includes(p.sku)) {
        original925 = 80; originalGold = 100;
      } else if (p.type === "סט תכשיטים") {
        original925 = 130; originalGold = 170;
      } else if (["001", "002", "021"].includes(p.sku)) {
        original925 = 130; originalGold = 150;
      }

      const sale925 = Math.round(original925 * 0.8);
      const saleGold = Math.round(originalGold * 0.8);

      return `
        <div class="upgrades-title">אפשרויות לשדרוג המתכת:</div>
        <div>• שדרוג לכסף 925: <span class="price-tag">+${sale925} ₪</span> <span style="text-decoration:line-through; color:#888;">(<span class="price-tag">+${original925} ₪</span>)</span></div>

      `;
    }

            <div class="details">

                <div class="product-sku">מק"ט: ${p.sku} | ${p.type}</div>
                <div class="product-title">${p.title}</div>
                <div class="price-row">

                <div class="product-description">${p.desc}</div>
                <div class="product-specs">
                  <strong>חומרים:</strong> ${p.material}<br>
                  <strong>גודל:</strong> ${p.size}<br>
                  <strong>גימור:</strong> מצופה בציפוי שקוף (היפואלרגני) לשימור הברק לאורך זמן.
                </div>
                ${lengthInfo}
              </div>
              <div class="upgrades-box">
                ${getUpgradeHtml(p)}
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // הרצה מיידית לטובת מנועי יצירת PDF
    renderCatalog();
  </script>
</body>
</html>
