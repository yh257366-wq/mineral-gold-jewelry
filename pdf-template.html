<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>קטלוג תכשיטים - תכשיטי מינרל גולד</title>
  <style>
    @page {
      size: A4;
      margin: 12mm;
    }
    body {
      font-family: 'Noto Sans Hebrew', sans-serif;
      color: #1c1917;
      margin: 0;
      padding: 0;
      background: #fff;
    }
    .catalog-header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #d4af37;
      padding-bottom: 10px;
    }
    .catalog-header h1 { margin: 0; color: #1c1917; font-size: 24px; }
    .catalog-header p { margin: 5px 0 0; color: #666; font-size: 14px; }

    .products-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* כרטיס מוצר מלא המיועד ל-PDF */
    .pdf-product-card {
      display: flex;
      gap: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 15px;
      page-break-inside: avoid; /* מונע שבירת כרטיס באמצע דף */
      break-inside: avoid;
    }

    .pdf-product-img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
    }

    .pdf-product-details {
      flex: 1;
    }

    .pdf-product-title {
      font-size: 18px;
      font-weight: bold;
      margin: 0 0 5px 0;
    }

    .pdf-product-sku {
      font-size: 12px;
      color: #71717a;
      margin-bottom: 10px;
    }

    .pdf-product-desc {
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .pdf-product-upgrades {
      font-size: 12px;
      background: #fafafa;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .pdf-product-price {
      font-size: 16px;
      font-weight: bold;
      color: #b91c1c;
    }
  </style>
</head>
<body>

  <div class="catalog-header">
    <h1>תכשיטי מינרל גולד - קטלוג מלא</h1>
    <p>קולקציית תכשיטים ייחודיים בעבודת יד</p>
  </div>

  <div id="catalog-products" class="products-container"></div>

  <!-- טעינת נתוני המוצרים מתוך קובץ ה-JS הקים באתר -->
  <script src="js/products.js"></script> 
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('catalog-products');
      
      // במידה והנתונים שמורים במשתנה/מערך בשם products
      if (typeof products !== 'undefined' && Array.isArray(products)) {
        products.forEach(prod => {
          const card = document.createElement('div');
          card.className = 'pdf-product-card';

          // הוספת מפרט שדרוגים אם קיים
          let upgradesHtml = '';
          if (prod.upgrades && prod.upgrades.length > 0) {
            upgradesHtml = `<div class="pdf-product-upgrades"><strong>אפשרויות שדרוג:</strong> ${prod.upgrades.join(', ')}</div>`;
          }

          card.innerHTML = `
            <img src="${prod.image}" class="pdf-product-img" loading="eager" />
            <div class="pdf-product-details">
              <div class="pdf-product-title">${prod.name}</div>
              <div class="pdf-product-sku">מק"ט: ${prod.sku || prod.id}</div>
              <div class="pdf-product-desc">${prod.description || ''}</div>
              ${upgradesHtml}
              <div class="pdf-product-price">מחיר: ₪${prod.price}</div>
            </div>
          `;
          container.appendChild(card);
        });
      }
    });
  </script>
</body>
</html>
